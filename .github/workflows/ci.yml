name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      # Three installs, not two: the root one is lint tooling only. It has to be
      # separate because typescript-eslint cannot run against the typescript@7
      # both workspaces build with — see eslint.config.js for the whole story.
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: make test
      - name: Validate production Compose
        env:
          DOMAIN: nightraze.example.com
          ACME_EMAIL: ops@example.com
        run: docker compose -f docker-compose.prod.yml config --quiet
