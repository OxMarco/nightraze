<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>nightraze.io</title>

    <!-- The document a portal iframes. nightraze.io/ is the page that should be
         found and shared; this one exists only to be embedded, so it carries no
         canonical, no Open Graph, no structured data, and asks not to be
         indexed — two URLs competing for the same game would only split it. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#010b10" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Classic script, so it has finished executing before the deferred module
         below imports the platform adapter that expects window.CrazyGames. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <!-- Fonts are self-hosted (client/public/fonts): no third-party request to
         flag in portal QA, no dependency on Google being reachable from
         wherever the portal's audience is. Font files load crossorigin per the
         font-fetch spec, hence the crossorigin preloads. -->
    <link rel="preload" href="/fonts/marcellus-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to play nightraze.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main-embed.tsx"></script>
  </body>
</html>
