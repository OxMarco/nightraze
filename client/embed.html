<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>nightraze.io</title>

    <!-- The document a portal iframes. nightraze.io/ is the page that should be
         found and shared; this one exists only to be embedded, so it carries no
         canonical, no Open Graph, no structured data, and asks not to be
         indexed — two URLs competing for the same game would only split it. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#010b10" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23010b10'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%235affdc' stroke-opacity='.35' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23d8fff2'/%3E%3C/svg%3E"
    />

    <!-- Classic script, so it has finished executing before the deferred module
         below imports the platform adapter that expects window.CrazyGames. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to play nightraze.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main-embed.tsx"></script>
  </body>
</html>
