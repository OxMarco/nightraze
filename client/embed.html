<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>nightraze.io</title>

    <!-- The document a portal iframes. nightraze.io/ is the page that should be
         found and shared; this one exists only to be embedded, so it carries no
         canonical, no Open Graph, no structured data, and asks not to be
         indexed — two URLs competing for the same game would only split it. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#010b10" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Classic script, so it has finished executing before the deferred module
         below imports the platform adapter that expects window.CrazyGames. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to play nightraze.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main-embed.tsx"></script>
  </body>
</html>
