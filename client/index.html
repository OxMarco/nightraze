<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>nightraze.io · free-for-all arena in the dark</title>
    <meta
      name="description"
      content="A free-for-all .io arena played in near-total darkness. You are a lantern: light is your score, your health, and how far away you can be seen."
    />
    <link rel="canonical" href="https://nightraze.io/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#010b10" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph (Facebook, Discord, Slack, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="nightraze.io" />
    <meta property="og:title" content="nightraze.io · free-for-all arena in the dark" />
    <meta
      property="og:description"
      content="Every move ripples the dark. Grow your light to score, shutter it to hide, drain other lanterns dry."
    />
    <meta property="og:url" content="https://nightraze.io/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://nightraze.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A lone lantern glowing in the black water of the nightraze arena" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="nightraze.io · free-for-all arena in the dark" />
    <meta
      name="twitter:description"
      content="Every move ripples the dark. Grow your light to score, shutter it to hide, drain other lanterns dry."
    />
    <meta name="twitter:image" content="https://nightraze.io/og.png" />

    <!-- Bookmarked / installed identity -->
    <meta name="apple-mobile-web-app-title" content="nightraze" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- the mark: the lantern creature with two plankton motes (master: /logo.png) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "nightraze.io",
        "url": "https://nightraze.io/",
        "description": "A free-for-all .io arena played in near-total darkness. You are a lantern: light is your score, your health, and how far away you can be seen.",
        "genre": ["Action", "Multiplayer", "Arena"],
        "gamePlatform": "Web browser",
        "playMode": "MultiPlayer",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Fonts are self-hosted (client/public/fonts): no third-party request to
         flag in portal QA, no dependency on Google being reachable from
         wherever the portal's audience is. Font files load crossorigin per the
         font-fetch spec, hence the crossorigin preloads. -->
    <link rel="preload" href="/fonts/marcellus-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to play nightraze.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
