<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>nightraze</title>

    <!-- The uploaded CrazyGames build. This document is served from their CDN,
         never from nightraze.io, and it is never the page anyone finds or
         shares — so it carries no canonical, no Open Graph, no structured data
         and no manifest. All of that belongs to client/index.html, which is
         still the game's own page.

         Every path here is relative. Uploaded builds are served from a
         subdirectory of the portal's CDN, and an absolute /assets/... would
         resolve against their root and 404 — hence base: "./" in
         vite.config.ts, and hence no leading slash on anything below. -->
    <meta name="theme-color" content="#010b10" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />

    <!-- Classic script, so it has finished executing before the deferred module
         below imports the platform adapter that expects window.CrazyGames.
         This is the one external request the build makes; the fonts below are
         bundled. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <link rel="preload" href="./fonts/marcellus-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./fonts/fonts.css" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to play nightraze.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
